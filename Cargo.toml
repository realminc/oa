[package]
name = "oa"
version = "0.8.1"
edition = "2024"
rust-version = "1.98"
autotests = false
description = "GPU-first semantic computing engine written in Rust"
repository = "https://github.com/realminc/oa"
license = "BUSL-1.1"

[workspace]
members = ["sdk/py"]
default-members = ["."]
resolver = "3"

[lib]
path = "src/rs/lib.rs"

[[test]]
name = "core"
path = "test/rs/test_core.rs"

[[test]]
name = "runtime"
path = "test/rs/test_runtime.rs"

[[test]]
name = "matrix"
path = "test/rs/test_matrix.rs"

[[test]]
