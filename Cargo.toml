[dependencies]
ash = "0.38"
# VP9 C-ABI structs only; released Ash remains the Vulkan loader and vk-mem ABI.
ash-vp9 = { package = "ash", git = "https://github.com/ash-rs/ash.git", rev = "33d758c81475c4852166d30655c85834e11b0731", default-features = false }
vk-mem = "0.5"

bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smallvec = "1"
serde_json = "1"
unicode-normalization = "0.1"
unicode-general-category = "1"
cpal = { version = "0.18.2", default-features = false }
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "pcm", "wav"] }
image-codec = { package = "image", version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "tga", "webp"] }
webp-codec = { package = "webp", version = "0.3.1", default-features = false }
libc = "0.2"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "zeroize"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
anyhow = "1"
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
