[package]
name = "oa"
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
autotests = false

[lib]
path = "src/rs/lib.rs"

[[test]]
name = "core"
path = "test/rs/test_core.rs"

[[test]]
name = "runtime"
path = "test/rs/test_runtime.rs"

[[test]]
name = "matrix"
path = "test/rs/test_matrix.rs"

[[example]]
name = "core_mat_mul_intro"
path = "sdk/rs/tutorials/core/mat_mul_intro.rs"

[[example]]
name = "core_mat_mul_bench"
path = "sdk/rs/benchmarks/core/mat_mul.rs"

[[example]]
name = "core_memory_bench"
path = "sdk/rs/benchmarks/core/memory.rs"

[[example]]
name = "core_vlm_bench"
path = "sdk/rs/benchmarks/core/vlm.rs"

[dependencies]
ash = "0.38"
vk-mem = "0.5"

bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smallvec = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
anyhow = "1"
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
