[package]
name = "oa"
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
autotests = false

[lib]
path = "src/rs/lib.rs"

[[test]]
name = "core"
path = "test/rs/test_core.rs"

[[test]]
name = "runtime"
path = "test/rs/test_runtime.rs"

[[test]]
name = "matrix"
path = "test/rs/test_matrix.rs"

[[test]]
name = "ml"
path = "test/rs/test_ml.rs"

[[test]]
name = "audio"
path = "test/rs/test_audio.rs"

[[test]]
name = "image"
path = "test/rs/test_image.rs"

[[test]]
name = "vision"
path = "test/rs/test_vision.rs"

[[test]]
name = "cryptography"
path = "test/rs/test_cryptography.rs"

[[test]]
name = "video"
path = "test/rs/test_video.rs"

[[test]]
name = "render"
path = "test/rs/test_render.rs"

[[example]]
name = "core_mat_mul_intro"
path = "sdk/rs/tutorials/core/mat_mul_intro.rs"

[[example]]
name = "core_mat_mul_bench"
path = "sdk/rs/benchmarks/core/mat_mul.rs"

[[example]]
name = "core_memory_bench"
path = "sdk/rs/benchmarks/core/memory.rs"

[[example]]
name = "core_vlm_bench"
path = "sdk/rs/benchmarks/core/vlm.rs"

[[example]]
name = "ml_nlp_char_rnn"
path = "sdk/rs/tutorials/ml/nlp/char_rnn.rs"

[[example]]
name = "ml_nlp_char_transformer"
path = "sdk/rs/tutorials/ml/nlp/char_transformer.rs"

[[example]]
name = "ml_nlp_char_transformer_profile"
path = "sdk/rs/benchmarks/ml/nlp/char_transformer.rs"

[dependencies]
ash = "0.38"
vk-mem = "0.5"

bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smallvec = "1"
cpal = { version = "0.18.2", default-features = false }
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "pcm", "wav"] }
image-codec = { package = "image", version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "tga", "webp"] }
webp-codec = { package = "webp", version = "0.3.1", default-features = false }
libc = "0.2"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "zeroize"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
anyhow = "1"
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
