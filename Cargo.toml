[package]
name = "oa"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"

[lib]
path = "src/rs/lib.rs"

[[example]]
name = "core_mat_mul_intro"
path = "sdk/rs/tutorials/core/mat_mul_intro.rs"

[[example]]
name = "core_mat_mul_bench"
path = "sdk/rs/benchmarks/core/mat_mul.rs"

[dependencies]
ash = "0.38"
vk-mem = "0.5"

bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smallvec = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
anyhow = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
