# OA Rust CI — Build, Test, Release
#
# GitHub-hosted runners use Lavapipe for a bounded, no-skip CPU-Vulkan smoke
# profile. Full ML/crypto, Vulkan Video, WSI, validation, and performance tests
# remain capability-gated to a discrete or integrated GPU.
#
# Triggers:
#   realminc/oa tag (v*) on main → build + test + release
#   realminc/oa pull request     → build + test
#
# Every job is repository-gated. The private empyrealm/oars staging repository
# may receive the same refs, but it must not consume hosted or self-hosted
# runner time.

name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]

env:
  RUSTUP_TOOLCHAIN: "1.98.1"
  SLANG_VERSION: "2026.5.2"

jobs:
  build:
    name: Build & Test
    if: github.repository == 'realminc/oa'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag validation needs the tagged commit's ancestry, not only the tag and
          # current main tips. A depth-1 fetch makes a valid ancestor look unrelated.
          fetch-depth: 0

      - name: Verify release tag and version sources agree
        if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.loads(open("Cargo.toml").read())["package"]["version"])')"
          PYTHON_VERSION="$(python3 -c 'import tomllib; print(tomllib.loads(open("sdk/py/pyproject.toml").read())["project"]["version"])')"
          test "$CARGO_VERSION" = "$TAG_VERSION" || {
            echo "::error::Cargo.toml=$CARGO_VERSION does not match tag $TAG_VERSION"
            exit 1
          }
          test "$PYTHON_VERSION" = "$TAG_VERSION" || {
            echo "::error::pyproject.toml=$PYTHON_VERSION does not match tag $TAG_VERSION"
            exit 1
          }

      - name: Install pinned Rust toolchain
        run: |
          rustup self update
          rustup toolchain uninstall "$RUSTUP_TOOLCHAIN" || true
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal --component clippy --component rustfmt
          rustup override set "$RUSTUP_TOOLCHAIN"

      - name: Validate generated and Python tooling
        run: |
          python3 -m unittest discover -s test/py -v
          python3 tools/gen/fn/generate.py --check
          git diff --check
          git diff --exit-code

      - name: Verify tag is on main
        if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "::error::Tag must be on main branch"
            exit 1
          fi

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libasound2-dev libvulkan-dev mesa-vulkan-drivers \
            pkg-config spirv-tools unzip
          # Set AR to use system ar instead of llvm-ar
          echo "AR=ar" >> $GITHUB_ENV

      - name: Install Slang
        run: |
          curl -fsSL -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          sudo mkdir -p /opt/slang
          sudo tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C /opt/slang
          test -x /opt/slang/bin/slangc
          echo /opt/slang/bin >> "$GITHUB_PATH"

      - name: Format, lint, test, and document
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

      # ── Packaging (tags only) ──────────────────────────────────────────────
      - name: Build and stage SDK programs
        if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo build -p oa --release --examples --locked
          python3 tools/build/stage.py --clean --profile release
          python3 tools/build/stage.py --profile release
          test -n "$(find bin/release/sdk -type f -perm -111 -print -quit)"

      - name: Package source, SDK programs, and build evidence
        if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          epoch="$(git show -s --format=%ct HEAD)"
          source_name="oa-${version}-source"
          sdk_name="oa-sdk-${version}-linux-x86_64"
          mkdir -p dist "stage/$source_name" "stage/$sdk_name"

          git archive --format=tar HEAD | tar -xf - -C "stage/$source_name"
          cp Cargo.lock "stage/$source_name/Cargo.lock"
          cp -a bin/release/sdk "stage/$sdk_name/sdk"
          cp README.md LICENSE NOTICE.md "stage/$sdk_name/"

          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "dist/${source_name}.tar.gz" -C stage "$source_name"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "dist/${sdk_name}.tar.gz" -C stage "$sdk_name"

          cargo tree --workspace --all-features --locked --prefix none \
            > "dist/oa-${version}-dependencies.txt"
          {
            echo "OA ${GITHUB_REF_NAME}"
            echo "commit=$(git rev-parse HEAD)"
            echo "source_date_epoch=${epoch}"
            rustc -Vv
            cargo -V
            clang --version | head -n 1
            slangc -version
            spirv-val --version
          } > "dist/oa-${version}-build-info.txt"

      - name: Build distro packages
        if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential rpm zstd libarchive-tools
          sudo gem install --no-document fpm

          # Create staging directory for distro packages
          mkdir -p stage/oa-distro
          cp -a bin/release/sdk/* stage/oa-distro/
          cp README.md LICENSE NOTICE.md stage/oa-distro/

          MAINT="Empyrealm <realminc.depravity737@passinbox.com>"
          URL="https://github.com/realminc/oa"; LIC="BUSL-1.1"
          pkg() {  # pkg <target> <name> <root> <desc> <dep...>
            local tgt="$1" name="$2" root="$3" desc="$4"; shift 4
            local deps=(); local d; for d in "$@"; do deps+=(--depends "$d"); done
            fpm -s dir -t "$tgt" -n "$name" -v "$VERSION" -a x86_64 --vendor "Realm" \
              --license "$LIC" --maintainer "$MAINT" --url "$URL" --description "$desc" \
              "${deps[@]}" -C "$root" -p dist/ usr
          }
          # runtime (oa): the Vulkan loader dependency name differs per distro.
          pkg deb    oa     stage/oa-distro     "OA — Vulkan 1.4 compute & ML runtime library and SDK" libvulkan1
          pkg rpm    oa     stage/oa-distro     "OA — Vulkan 1.4 compute & ML runtime library and SDK" vulkan-loader
          pkg pacman oa     stage/oa-distro     "OA — Vulkan 1.4 compute & ML runtime library and SDK" vulkan-icd-loader

          ( cd dist && sha256sum *.tar.gz *.deb *.rpm *.pkg.tar.zst > SHA256SUMS.txt )
          echo "### 📦 Distro packages" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/*.deb dist/*.rpm dist/*.pkg.tar.zst | awk '{print "- " $NF " (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust release assets
        if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: oa-dist
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.txt

  wheel:
    name: Build and test portable Python wheel
    if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release identity
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.loads(open("Cargo.toml").read())["package"]["version"])')"
          PYTHON_VERSION="$(python3 -c 'import tomllib; print(tomllib.loads(open("sdk/py/pyproject.toml").read())["project"]["version"])')"
          test "$CARGO_VERSION" = "$TAG_VERSION" || {
            echo "::error::Cargo.toml=$CARGO_VERSION does not match tag $TAG_VERSION"
            exit 1
          }
          test "$PYTHON_VERSION" = "$TAG_VERSION" || {
            echo "::error::pyproject.toml=$PYTHON_VERSION does not match tag $TAG_VERSION"
            exit 1
          }

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libasound2-dev libvulkan-dev mesa-vulkan-drivers \
            pkg-config spirv-tools
          # Set AR to use system ar instead of llvm-ar
          echo "AR=ar" >> $GITHUB_ENV
          curl -fsSL -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          sudo mkdir -p /opt/slang
          sudo tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C /opt/slang
          echo /opt/slang/bin >> "$GITHUB_PATH"

      - name: Install pinned Rust and Python build tools
        run: |
          rustup self update
          rustup toolchain uninstall "$RUSTUP_TOOLCHAIN" || true
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUSTUP_TOOLCHAIN"
          python -m pip install --upgrade pip
          python -m pip install maturin patchelf ziglang

      - name: Build portable ABI3 wheel
        working-directory: sdk/py
        run: python -m maturin build --release --zig --locked

      - name: Smoke-test complete installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/oa-wheel-smoke"
          "$RUNNER_TEMP/oa-wheel-smoke/bin/pip" install target/wheels/oapython-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/oa-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import oa

          assert importlib.metadata.version("oapython") == oa.__version__
          assert callable(oa.Engine)
          assert callable(oa.matrix.add)
          assert oa.audio.Audio is oa.Audio
          assert oa.image.Image is oa.Image
          PY
          unzip -l "$GITHUB_WORKSPACE"/target/wheels/oapython-*.whl > wheel-files.txt
          grep -q 'oa/_native.abi3.so' wheel-files.txt
          grep -q 'oa/_native.pyi' wheel-files.txt
          grep -q 'oa/py.typed' wheel-files.txt
          grep -q 'oa/ml/matrix.py' wheel-files.txt
          if grep -q '__pycache__\|\.pyc' wheel-files.txt; then
            echo "::error::wheel contains Python cache files"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oa-wheel
          retention-days: 7
          if-no-files-found: error
          path: target/wheels/oapython-*.whl

  pypi:
    name: Publish to PyPI (oapython preview)
    runs-on: ubuntu-24.04
    needs: [build, wheel]
    if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oa-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [build, wheel, pypi]
    if: github.repository == 'realminc/oa' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the full ancestry so a tag remains verifiable after main advances.
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "::error::Release tags must be on main branch"
            exit 1
          fi

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: oa-dist
          path: dist

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: oa-wheel
          path: dist

      - name: Use the exact wheel published by PyPI
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -name '*.whl' -delete
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.request

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          metadata = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(
                      f"https://pypi.org/pypi/oapython/{version}/json?attempt={attempt}"
                  ) as response:
                      metadata = json.load(response)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          candidates = [
              item for item in metadata["urls"]
              if item["packagetype"] == "bdist_wheel"
              and "cp310-abi3-manylinux" in item["filename"]
              and not item["yanked"]
          ]
          assert len(candidates) == 1, [item["filename"] for item in candidates]
          item = candidates[0]
          target = pathlib.Path("dist", item["filename"])
          urllib.request.urlretrieve(item["url"], target)
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          assert actual == item["digests"]["sha256"], (actual, item["digests"]["sha256"])
          PY

      - name: Create complete checksum manifest
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r asset; do sha256sum "$asset"; done \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: true
          body: |
            ## OA ${{ github.ref_name }} — Rust development preview

            This prerelease publishes the exact tagged OA source together with the
            automated Rust runtime and SDK packages. When the independent wheel job
            succeeds, it attaches and publishes the matching `oapython` wheel.

            ⚠️ **Preview, not a stable API.** Read the README's honest preview
            boundaries and the changelog for this tag before depending on
            experimental hardware paths.

            ### Install (Arch / AUR)
            ```bash
            paru -S oa-bin      # prebuilt (this release)
            # or build from source:
            paru -S oa-git
            ```

            ### Python 3.10+
            ```bash
            python -m pip install oapython
            ```

            ### Verify automated package assets
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.whl
            dist/SHA256SUMS.txt

      - name: Publish and anonymously verify complete checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets public-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          (
            cd release-assets
            rm -f SHA256SUMS.txt
            manifest_tmp="$(mktemp)"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r asset; do sha256sum "$asset"; done \
              > "$manifest_tmp"
            mv "$manifest_tmp" SHA256SUMS.txt
            gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          )

          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          curl -fsSL --retry 5 --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            "${release_url}/sHA256SUMS.txt?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o public-assets/SHA256SUMS.txt
          cmp release-assets/SHA256SUMS.txt public-assets/SHA256SUMS.txt
          (
            cd public-assets
            while read -r digest asset; do
              test -n "$digest"
              test -n "$asset"
              curl -fsSL --retry 5 --retry-delay 2 \
                "${release_url}/${asset}" \
                -o "$asset"
            done < SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
