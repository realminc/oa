[package]
name = "sdk"
version = "0.14.1"
edition = "2024"
rust-version = "1.98"
publish = false
description = "OA SDK workloads, tutorials, examples and benchmarks"

[lib]
name = "sdk"
path = "rs/lib/lib.rs"

[dependencies]
oa = { package = "oarust", version = "0.14.1", path = ".." }
serde_json = "1"
unicode-normalization = "0.1"
unicode-general-category = "1"

[dev-dependencies]
libc = "0.2"
anyhow = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[test]]
name = "sdk"
path = "../test/rs/test_sdk.rs"

