[[examples]]
id = "crypto-shake256"
module = "Crypto"
directory = "crypto"
stem = "shake256"
title = "Hash a message batch with SHAKE-256"
summary = "Run three SHAKE-256 digests on the GPU and compare every output byte with the independent CPU implementation."
capability = "Vulkan compute + Crypto"
cppTarget = "ExampleCryptoShake256"
pythonProfile = "crypto-gpu"
generated = true
expectedOutput = "3 GPU SHAKE-256 digests match the CPU oracle"
cppSymbols = ["oa::FnHash::shake256", "oa::FnMatrix::copyToHost"]
pythonSymbols = ["oa.FnHash.shake256", "oa.FnMatrix.copyToHost", "oa.ScalarType"]

[[examples.presentation]]
kind = "terminalOutput"
title = "Verified Python run"
description = "Runtime evidence from the generated Python example on an Intel Iris Xe Vulkan device. One SHAKE-256 shader pipeline handles the complete three-message batch."
filename = "shake256.py · output"
language = "bash"
generatedBy = ".venv/bin/python sdk/py/examples/crypto/shake256.py"
code = '''$ .venv/bin/python sdk/py/examples/crypto/shake256.py
11:43:46.471 [INFO ] [RT  ] ComputeDevice (0): Intel(R) Iris(R) Xe Graphics (TGL GT2), vulkan 1.4.354, 11 GB
11:43:46.481 [INFO ] [RT  ] bindless heap: buffers=262143 imageSlots=16383 samplerSlots=2047, UPDATE_AFTER_BIND
11:43:46.499 [INFO ] [COMP] pipeline cache: loaded 10860399 bytes from $OA_ROOT/var/vk/pipeline.vcache
11:43:46.510 [INFO ] [COMP] Loading 1 shader pipeline on demand (1 thread, warm cache)
11:43:46.511 [INFO ] [COMP] Loaded 1/1 shader pipeline on demand (failed=0, threads=1, 0.81 ms)
3 GPU SHAKE-256 digests match the CPU oracle
'''

[[examples.steps]]
operation = "bytes.asciiRows"
result = "messages"
values = ["alpha", "bravo", "crypt"]

[[examples.steps]]
operation = "crypto.shake256"
result = "digests"
input = "messages"
digestBytes = 32

[[examples.checks]]
kind = "shake256CpuOracle"
input = "messages"
output = "digests"

