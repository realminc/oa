schemaVersion = 1

[[examples]]
id = "core-matrix-add"
module = "Core"
directory = "core"
stem = "matrix"
title = "Add two device matrices"
summary = "Create two GPU-resident matrices, add them, and verify the result after the language-appropriate completion boundary."
capability = "Vulkan compute"
cppTarget = "ExampleCoreMatrix"
pythonProfile = "gpu"
generated = true
expectedOutput = "Matrix addition verified: every value is 3"
cppSymbols = [
	"oa::FnMatrix::ones",
	"oa::FnMatrix::full",
	"oa::FnMatrix::add",
	"oa::FnMatrix::copyToHost",
]
pythonSymbols = [
	"oa.FnMatrix.ones",
	"oa.FnMatrix.full",
	"oa.FnMatrix.add",
	"oa.FnMatrix.copyToHost",
]

[[examples.steps]]
operation = "matrix.ones"
result = "one"
shape = [2, 3]

[[examples.steps]]
operation = "matrix.full"
result = "two"
shape = [2, 3]
value = 2.0

[[examples.steps]]
operation = "matrix.add"
result = "sum"
inputs = ["one", "two"]

[[examples.checks]]
kind = "matrixAllClose"
input = "sum"
count = 6
value = 3.0
tolerance = 0.000001

[[examples.presentation]]
kind = "terminalOutput"
title = "Verified Python run"
description = "Runtime evidence from the generated Python example on an Intel Iris Xe Vulkan device. The batch loader creates only the two shader pipelines required by this graph."
filename = "matrix.py · output"
language = "bash"
generatedBy = ".venv/bin/python sdk/py/examples/core/matrix.py"
code = '''$ .venv/bin/python sdk/py/examples/core/matrix.py
10:47:17.554 [INFO ] [RT  ] ComputeDevice (0): Intel(R) Iris(R) Xe Graphics (TGL GT2), vulkan 1.4.354, 11 GB
10:47:17.563 [INFO ] [RT  ] bindless heap: buffers=262143 imageSlots=16383 samplerSlots=2047, UPDATE_AFTER_BIND
10:47:17.577 [INFO ] [COMP] pipeline cache: loaded 10860399 bytes from $OA_ROOT/var/vk/pipeline.vcache
10:47:17.589 [INFO ] [COMP] Loading 2 shader pipelines on demand (1 thread, warm cache)
10:47:17.590 [INFO ] [COMP] Loaded 2/2 shader pipelines on demand (failed=0, threads=1, 0.96 ms)
Matrix addition verified: every value is 3
'''

[[examples]]
id = "audio-process"
module = "Audio"
directory = "audio"
stem = "audio"
title = "Add room reflections and save audio"
summary = "Load the OA narration, convert it to mono, normalize it, render a native GPU reverberation tail, then save a checked WAV output."
capability = "Vulkan compute"
cppTarget = "ExampleAudio"
pythonProfile = "gpu"
generated = true
expectedOutput = "Saved reverberated audio (1.5 s tail):"
assets = [
	"audio/oaNarration.wav",
	"audio/oaNarration.mp3",
	"documentation/examples/audio/oaNarrationRoom.wav",
	"documentation/examples/audio/oaNarrationRoom.mp3",
	"documentation/examples/audio/oaNarrationRoomViewer.jpg",
]
cppSymbols = [
	"oa::Audio",
	"oa::FnAudio::decodeFile",
	"oa::FnAudio::toMono",
	"oa::FnAudio::normalize",
	"oa::FnAudio::fade",
	"oa::FnAudio::reverb",
	"oa::FnAudio::saveWavF32",
	"oa::Viewer::preview",
]
pythonSymbols = [
	"oa.Audio",
	"oa.FnAudio.decodeFile",
	"oa.FnAudio.toMono",
	"oa.FnAudio.normalize",
	"oa.FnAudio.fade",
	"oa.FnAudio.reverb",
	"oa.FnAudio.saveWavF32",
	"oa.Viewer.preview",
]

[examples.preview]
input = "output"
title = "OA audio · room reverb"
mode = "audio"
width = 960
height = 360

[[examples.presentation]]
kind = "audioComparison"
title = "Before / after"
description = "Play the authored narration beside the artifact produced by this exact SDK example. The processed WAV is copied byte-for-byte from var/example/audio/oaNarrationRoom.wav after a successful run."

[[examples.presentation.items]]
role = "source"
label = "Source"
description = "The unprocessed OA narration loaded by the example."
asset = "audio/oaNarration.wav"
fallbackAsset = "audio/oaNarration.mp3"
mimeType = "audio/wav"
fallbackMimeType = "audio/mpeg"
sampleRate = 24000
channelCount = 1
sampleCount = 300480
durationSeconds = 12.52
generatedBy = "OA-authored narration asset"

[[examples.presentation.items]]
role = "processed"
label = "Processed"
description = "Normalized, faded, and rendered through oa::FnAudio::reverb with a 1.5 second tail."
asset = "documentation/examples/audio/oaNarrationRoom.wav"
fallbackAsset = "documentation/examples/audio/oaNarrationRoom.mp3"
mimeType = "audio/wav"
fallbackMimeType = "audio/mpeg"
sampleRate = 24000
channelCount = 1
sampleCount = 336480
durationSeconds = 14.02
generatedBy = "sdk/py/examples/audio/audio.py"

[[examples.presentation]]
kind = "viewerCapture"
title = "oa::Viewer"
description = "The processed WAV opened by this example's optional --preview path in OA's native GPU waveform viewer."
asset = "documentation/examples/audio/oaNarrationRoomViewer.jpg"
mimeType = "image/jpeg"
width = 960
height = 434
alt = "oa::Viewer displaying the processed OA narration as a GPU-rendered waveform"
generatedBy = "bin/release/example/audio/exampleAudio --preview"

[[examples.steps]]
operation = "audio.decodeAsset"
result = "audio"
path = "audio/oaNarration.wav"

[[examples.steps]]
operation = "audio.toMono"
result = "mono"
input = "audio"

[[examples.steps]]
operation = "audio.normalize"
result = "normalized"
input = "mono"
targetDb = -3.0

[[examples.steps]]
operation = "audio.fade"
result = "faded"
input = "normalized"
fadeInSamples = 2400
fadeOutSamples = 2400

[[examples.steps]]
operation = "audio.reverb"
result = "reverberated"
input = "faded"
decaySeconds = 1.5
wet = 0.40

[[examples.steps]]
operation = "audio.saveWavF32"
result = "output"
input = "reverberated"
path = "example/audio/oaNarrationRoom.wav"

[[examples.checks]]
kind = "audioMetadata"
input = "reverberated"
sampleRate = 24000
channels = 1

[[examples.checks]]
kind = "audioTail"
input = "reverberated"
source = "faded"
tailMilliseconds = 1500

[[examples.checks]]
kind = "fileExists"
input = "output"

