# Fn schema — tensor-native Vision/FnImage pointwise, channel and composite ops.
surface = "public_operation"
generate_python_bindings = true

generate_engine_overloads = true
generate_forwarders = true

[[ops]]
name = "thresholdBinary"
category = "Pixel"
kind = "unary"
kernel_forward = "ImagePointwise"
slang_path = "Vision/color"
log_component = "VISION"
notes = "Global binary threshold."
body = "manual_session"
api_params = ["const oa::Matrix& inImage", "oa::F32 inThreshold", "oa::F32 inMaxValue = 1.0F"]
[ops.contract]
input_kinds = ["matrix"]
output_kinds = ["matrix"]
shape_rule = "match_input"
dtype_rule = "match_input"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "straight_line"
differentiation = "none"
lowering = "dispatch"
attributes = [
    { name = "threshold", kind = "float", source = "inThreshold" },
    { name = "maxValue", kind = "float", source = "inMaxValue" },
]

