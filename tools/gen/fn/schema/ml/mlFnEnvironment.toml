# Fn schema — environment tensor transforms.
category = "Environment"
namespace = "oa::FnEnvironment"
file_prefix = "FnEnvironment"
cpp_subdir = "FnEnvironment"

[[ops]]
name = "normalizeObservation"
kind = "unary"
surface = "public_operation"
body = "manual_session"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "const oa::Matrix& inObservation",
    "const oa::Matrix& inMean",
    "const oa::Matrix& inStddev",
    "oa::F32 inEpsilon = 1.0e-6F",
    "oa::F32 inClip = 10.0F",
]
notes = "Normalize and clip observations with broadcast statistics."

[ops.contract]
input_kinds = ["matrix", "matrix", "matrix"]
output_kinds = ["matrix"]
shape_rule = "explicit"
dtype_rule = "match_input"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "straight_line"
differentiation = "reverse"
lowering = "dispatch"
attributes = [
    { name = "epsilon", kind = "float", source = "inEpsilon" },
    { name = "clip", kind = "float", source = "inClip" },
]

[ops.autograd]
formula = "manual"
attach = "manual"
inputs = ["inObservation", "inMean", "inStddev"]
outputs = ["Output"]
implementation = "source/cpp/lib/oa/ml/fnEnvironment.cpp:normalizeObservation"

[ops.python]
args = ["observation", "mean", "stddev", "epsilon", "clip"]
result_validation = "not_empty"
error = "NormalizeObservation rejected its input"
doc = "Normalize and clip observations with broadcast statistics."

[[ops]]
name = "scaleAction"
kind = "unary"
surface = "public_operation"
body = "manual_session"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "const oa::Matrix& inAction",
    "oa::F32 inSourceMinimum",
    "oa::F32 inSourceMaximum",
    "oa::F32 inTargetMinimum",
    "oa::F32 inTargetMaximum",
    "bool inClamp = true",
]
notes = "Map an action tensor between bounded intervals."

[ops.contract]
input_kinds = ["matrix"]
output_kinds = ["matrix"]
shape_rule = "match_input"
dtype_rule = "match_input"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "conditional"
differentiation = "reverse"
lowering = "dispatch"
attributes = [
    { name = "sourceMinimum", kind = "float", source = "inSourceMinimum" },
    { name = "sourceMaximum", kind = "float", source = "inSourceMaximum" },
    { name = "targetMinimum", kind = "float", source = "inTargetMinimum" },
    { name = "targetMaximum", kind = "float", source = "inTargetMaximum" },
    { name = "clamp", kind = "boolean", source = "inClamp" },
]

[ops.autograd]
formula = "manual"
attach = "manual"
inputs = ["inAction"]
outputs = ["Output"]
implementation = "source/cpp/lib/oa/ml/fnEnvironment.cpp:scaleAction"

[ops.python]
args = ["action", "sourceMinimum", "sourceMaximum", "targetMinimum", "targetMaximum", "clamp"]
result_validation = "not_empty"
error = "ScaleAction rejected its input"
doc = "Map an action tensor between bounded intervals."

[[ops]]
name = "clipReward"
kind = "unary"
surface = "public_operation"
body = "manual_session"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "const oa::Matrix& inReward",
    "oa::F32 inMinimum = -1.0F",
    "oa::F32 inMaximum = 1.0F",
]
notes = "Clip rewards to a closed interval."

[ops.contract]
input_kinds = ["matrix"]
output_kinds = ["matrix"]
shape_rule = "match_input"
dtype_rule = "match_input"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "straight_line"
differentiation = "reverse"
lowering = "dispatch"
attributes = [
    { name = "minimum", kind = "float", source = "inMinimum" },
    { name = "maximum", kind = "float", source = "inMaximum" },
]

[ops.autograd]
formula = "manual"
attach = "manual"
inputs = ["inReward"]
outputs = ["Output"]
implementation = "source/cpp/lib/oa/ml/fnEnvironment.cpp:clipReward"

[ops.python]
args = ["reward", "minimum", "maximum"]
result_validation = "not_empty"
error = "ClipReward rejected its input"
doc = "Clip rewards to a closed interval."
