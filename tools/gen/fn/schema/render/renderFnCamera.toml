# Fn schema — Render host camera utilities.
#
# Camera mutation and matrix math are CPU value transformations. oa::Renderer owns
# device work; these helpers intentionally have no device-operation contract.
# FnCamera is a non-instantiable static class; the namespace field below is the
# generator's qualified C++ operation-owner field, not an attachable object.
surface = "host_utility"
category = "Camera"
namespace = "oa::FnCamera"
file_prefix = "FnCamera"
cpp_subdir = "FnCamera"

[[ops]]
name = "initPerspective"
category = "Camera"
kind = "unary"
body = "cpu_util"
generate_declaration = false
api_return = "void"
api_params = [
    "oa::Camera& inCamera",
    "const VlmVec3& inPosition = {0.0f, 2.0f, 5.0f}",
    "const VlmVec3& inTarget = {0.0f, 0.0f, 0.0f}",
    "oa::F32 inFovY = 60.0f",
    "oa::F32 inAspect = 1280.0f / 720.0f",
    "oa::F32 inNear = 0.1f",
    "oa::F32 inFar = 100.0f",
]
notes = "Initialize a perspective camera value."

