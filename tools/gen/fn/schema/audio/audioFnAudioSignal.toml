# Fn schema — semantic oa::Audio signal operations.
surface = "public_operation"
generate_python_bindings = true
#
# These schemas own the public declarations and operation contracts. Their
# private implementations validate oa::Audio metadata and either compose verified
# matrix operations or dispatch the named oa::Audio kernel.

[[ops]]
name = "normalize"
category = "Signal"
kind = "unary"
body = "manual_session"
notes = "Peak or RMS normalization to a target dB level while preserving audio metadata."
api_return = "oa::Audio"
api_params = [
    "const oa::Audio& inAudio",
    "oa::F32 inTargetDb = -3.0F",
    "oa::U8 inMode = 0",
]

[ops.contract]
input_kinds = ["audio"]
output_kinds = ["audio"]
shape_rule = "match_input"
dtype_rule = "match_input"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "straight_line"
differentiation = "none"
lowering = "dispatch"
attributes = [
    { name = "targetDb", kind = "float", source = "inTargetDb" },
    { name = "mode", kind = "unsigned_integer", source = "inMode" },
]

[[ops]]
name = "resample"
category = "Signal"
kind = "unary"
body = "manual_session"
kernel_forward = "AudioResample"
notes = "Windowed-sinc resampling with sample rate derived from the input audio value."
api_return = "oa::Audio"
api_params = [
    "const oa::Audio& inAudio",
    "oa::U32 inOutRate = 16'000U",
    "oa::U32 inFilterHalfWidth = 64U",
]

[ops.contract]
input_kinds = ["audio"]
output_kinds = ["audio"]
shape_rule = "explicit"
dtype_rule = "match_input"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "straight_line"
differentiation = "none"
lowering = "dispatch"
attributes = [
    { name = "outRate", kind = "unsigned_integer", source = "inOutRate" },
    { name = "filterHalfWidth", kind = "unsigned_integer", source = "inFilterHalfWidth" },
]

[[ops]]
name = "gain"
category = "Signal"
kind = "unary"
body = "manual_session"
notes = "Apply scalar gain in dB while preserving audio metadata."
api_return = "oa::Audio"
api_params = ["const oa::Audio& inAudio", "oa::F32 inGainDb"]

[ops.contract]
input_kinds = ["audio"]
output_kinds = ["audio"]
