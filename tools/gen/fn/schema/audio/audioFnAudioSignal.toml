[[ops]]
name = "biquad"
category = "Signal"
kind = "unary"
body = "manual_session"
kernel_forward = "AudioBiquadApply"
notes = "Apply one stable a0-normalized biquad independently per channel with zero initial state."
api_return = "oa::Audio"
api_params = [
    "const oa::Audio& inAudio",
    "const oa::BiquadCoefficients& inCoefficients = {}",
