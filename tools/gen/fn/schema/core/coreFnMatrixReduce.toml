[ops.contract]
input_kinds = ["matrix", "matrix", "matrix"]
output_kinds = ["matrix"]
shape_rule = "explicit"
dtype_rule = "explicit"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "straight_line"
differentiation = "none"
lowering = "dispatch"

[ops.python]
args = ["logits", "labels", "mask"]
doc = "Count correct masked categorical predictions into one device UInt32 scalar."

