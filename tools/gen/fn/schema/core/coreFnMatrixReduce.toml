# Fn schema — Core/FnMatrix Reduce ops.
surface = "public_operation"
autograd_node_header = "oa/core/autograd/matrix/autogradReduce.h"
#
# Reduction bodies are hand-written context recorders because the dim>=0 path
# has custom shape arithmetic that's not worth modelling in the schema yet.

[[ops]]
name           = "sum"
category       = "Reduce"
kind           = "reduce_full"
kernel_forward = "Sum"
log_component  = "ML"
body           = "manual_session"
extra_params   = [{ name = "dim", type = "oa::I32", default = "-1" }]
api_params     = [
    "const oa::Matrix& inA",
    "oa::I32 inDim = -1",
]
api_return     = "oa::Matrix"
dispatch_workgroups = 1                     # full reduction → single workgroup
output         = { shape = "scalar_1d", dtype = "match_input" }
notes          = "Reduce by summation; a valid non-negative Dim produces a keep-dimension axis reduction, while -1 produces a full reduction."

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"
attributes          = [
    { name = "dim", kind = "signed_integer", source = "inDim" },
]

[ops.autograd]
grad_class   = "oa::GradSum"
inputs       = ["inA"]
saved        = ["inA"]
formula      = "manual"
attach       = "standard"
output_shape = true

[ops.python]
args = ["a", "dim"]
doc = "Reduce by summation, preserving a selected dimension or reducing all values when dim is -1."

[ops.test]
# For reduce_full, we sum all elements and compare to CPU reference
cpu_reference = "std::accumulate(a_host.begin(), a_host.end(), 0.0f)"
tolerance = "1e-3f"
test_sizes = [256, 1024]

[[ops]]
name           = "mean"
category       = "Reduce"
kind           = "reduce_full"
log_component  = "ML"
body           = "manual_session"
extra_params   = [{ name = "dim", type = "oa::I32", default = "-1" }]
api_params     = [
    "const oa::Matrix& inA",
    "oa::I32 inDim = -1",
]
api_return     = "oa::Matrix"
dispatch_workgroups = 1
output         = { shape = "scalar_1d", dtype = "match_input" }
notes          = "Reduce by arithmetic mean; a valid non-negative Dim produces a keep-dimension axis reduction, while -1 produces a full reduction."

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"
attributes          = [
    { name = "dim", kind = "signed_integer", source = "inDim" },
]

[ops.autograd]
grad_class   = "oa::GradMean"
inputs       = ["inA"]
saved        = ["inA"]
formula      = "manual"
attach       = "standard"
output_shape = true
state        = [{ member = "dim_", source = "inDim", type = "oa::I32" }]

[ops.python]
args = ["a", "dim"]
doc = "Reduce by arithmetic mean, preserving a selected dimension or reducing all values when dim is -1."

[ops.test]
cpu_reference = "std::accumulate(a_host.begin(), a_host.end(), 0.0f) / static_cast<float>(N)"
tolerance = "1e-3f"
test_sizes = [256, 1024]

[[ops]]
name            = "softmax"
category        = "Reduce"
kind            = "unary"
kernel_forward  = "Softmax"
kernel_backward = "SoftmaxBwd"
log_component   = "ML"
body            = "manual_session"
extra_params    = [{ name = "dim", type = "oa::I32", default = "-1" }]
api_params      = [
    "const oa::Matrix& inA",
    "oa::I32 inDim = -1",
]
api_return      = "oa::Matrix"
notes           = "Stable softmax over the selected dimension; -1 selects the last dimension."

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"
attributes          = [
    { name = "dim", kind = "signed_integer", source = "inDim" },
]

[ops.autograd]
grad_class   = "oa::GradSoftmax"
inputs       = ["inA"]
saved        = ["out"]
formula      = "manual"
attach       = "standard"
output_shape = true
state        = [{ member = "dim_", source = "inDim", type = "oa::I32" }]

[ops.python]
args = ["a", "dim"]
doc = "Stable softmax over the selected dimension; -1 selects the last dimension."

[ops.test]
cpu_reference = "std::exp(a_host[i]) / std::accumulate(a_host.begin(), a_host.end(), 0.0f, [](float sum, float x) { return sum + std::exp(x); })"
tolerance = "1e-3f"
test_sizes = [256]

[[ops]]
name            = "logSoftmax"
category        = "Reduce"
kind            = "unary"
kernel_forward  = "LogSoftmax"
kernel_backward = "LogSoftmaxBwd"
log_component   = "ML"
body            = "manual_session"
extra_params    = [{ name = "dim", type = "oa::I32", default = "-1" }]
api_params      = [
    "const oa::Matrix& inA",
    "oa::I32 inDim = -1",
]
api_return      = "oa::Matrix"
notes           = "Stable log-softmax over the selected dimension; -1 selects the last dimension."

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"
attributes          = [
    { name = "dim", kind = "signed_integer", source = "inDim" },
]

[ops.autograd]
grad_class   = "oa::GradLogSoftmax"
inputs       = ["inA"]
saved        = ["out"]
formula      = "manual"
attach       = "standard"
output_shape = true
state        = [{ member = "dim_", source = "inDim", type = "oa::I32" }]

[ops.python]
args = ["a", "dim"]
doc = "Stable log-softmax over the selected dimension; -1 selects the last dimension."

[ops.test]
cpu_reference = "a_host[i] - std::log(std::accumulate(a_host.begin(), a_host.end(), 0.0f, [](float sum, float x) { return sum + std::exp(x); }))"
tolerance = "1e-3f"
test_sizes = [256]

[[ops]]
name           = "max"
category       = "Reduce"
kind           = "reduce_full"
kernel_forward = "Max"
kernel_backward = "MaxBwd"
log_component  = "ML"
body           = "manual_session"
extra_params   = [{ name = "dim", type = "oa::I32", default = "-1" }]
api_params     = [
    "const oa::Matrix& inA",
    "oa::I32 inDim = -1",
]
api_return     = "oa::Matrix"
dispatch_workgroups = 1
output         = { shape = "scalar_1d", dtype = "match_input" }
notes          = "Reduce all values by maximum; dim is retained as a compatibility parameter and is not a dimensional reduction."

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"

[ops.autograd]
grad_class   = "oa::GradMax"
inputs       = ["inA"]
saved        = ["inA", "out"]
formula      = "manual"
attach       = "standard"
output_shape = true

[ops.python]
args = ["a", "dim"]
doc = "Reduce all matrix values by maximum; dim is currently a compatibility parameter."

[ops.test]
# For reduce_full, we find max of all elements and compare to CPU reference
cpu_reference = "*std::max_element(a_host.begin(), a_host.end())"
tolerance = "1e-4f"
test_sizes = [256, 1024]

# --- Device-resident metric counters ----------------------------------------
[[ops]]
name = "categoricalAccuracyCount"
category = "Reduce"
kind = "binary"
surface = "public_operation"
kernel_forward = "CategoricalAccuracyCount"
body = "manual_session"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "const oa::Matrix& inLogits",
    "const oa::Matrix& inLabels",
]
notes = "Count correct last-axis categorical predictions into one device UInt32 scalar."

[ops.kernel]
id_prefix = "Ml"
id_local = 310
category = "Ml"
origin = "oa"
source = "flat/categoricalAccuracyCount"

[ops.contract]
input_kinds = ["matrix", "matrix"]
output_kinds = ["matrix"]
shape_rule = "explicit"
dtype_rule = "explicit"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "straight_line"
differentiation = "none"
lowering = "dispatch"

[ops.python]
args = ["logits", "labels"]
doc = "Count correct last-axis categorical predictions into one device UInt32 scalar."

[[ops]]
name = "maskedCategoricalAccuracyCount"
