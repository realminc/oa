# Fn schema — Core matrix dtype conversion.
category = "Dtype"
namespace = "oa::FnMatrix"
file_prefix = "FnMatrix"
cpp_subdir = "FnMatrix"

[[ops]]
name = "cast"
kind = "unary"
surface = "public_operation"
body = "manual_session"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "const oa::Matrix& inSrc",
    "oa::ScalarType inDtype",
]
notes = "Convert a matrix to an explicit storage dtype; an unchanged dtype is a no-op alias."

[ops.contract]
input_kinds = ["matrix"]
output_kinds = ["matrix"]
shape_rule = "match_input"
dtype_rule = "explicit"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "conditional"
differentiation = "reverse"
lowering = "dispatch"
attributes = [
    { name = "dtype", kind = "signed_integer", source = "inDtype" },
]

[ops.autograd]
formula = "manual"
attach = "manual"
inputs = ["inSrc"]
outputs = ["out"]
implementation = "source/cpp/lib/oa/Core/FnMatrix/Elemwise/FnMatrixElemwise.cpp:Cast"

[ops.python]
args = ["src", "dtype"]
doc = "Convert A to Dtype; returns an alias when the dtype is unchanged."

[[ops]]
name = "castInto"
kind = "binary"
surface = "public_cpp_operation"
body = "manual_session"
generate_declaration = false
api_return = "void"
api_params = [
    "const oa::Matrix& inSrc",
    "oa::Matrix& outDst",
]
notes = "Convert into preallocated destination storage without changing its buffer identity."

[ops.contract]
input_kinds = ["matrix", "matrix"]
output_kinds = ["matrix"]
shape_rule = "match_input"
dtype_rule = "explicit"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = [1]
output_alias_inputs = [1]
control_flow = "conditional"
differentiation = "none"
lowering = "dispatch"
