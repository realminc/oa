# Fn schema — Core scalar in-place compatibility operations.
category = "inPlace"
namespace = "oa::FnMatrix"
file_prefix = "FnMatrix"
cpp_subdir = "FnMatrix"
surface = "public_cpp_operation"

[[ops]]
name = "scaleInPlace"
kind = "unary_scalar"
kernel_forward = "Scale"
log_component = "ML"
notes = "Multiply an existing matrix by a scalar in place."
body = "manual_session"
generate_declaration = false
api_params = ["oa::Matrix& inSelf", "oa::F32 inScalar"]
api_return = "void"
scalar_param = { name = "scalar", type = "oa::F32", push_field = "Alpha" }

[ops.contract]
input_kinds = ["matrix"]
output_kinds = ["matrix"]
shape_rule = "match_input"
dtype_rule = "match_input"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = [0]
output_alias_inputs = [0]
control_flow = "straight_line"
differentiation = "none"
lowering = "dispatch"

