# Fn schema — Core/FnMatrix RNG and fill ops (4).
surface = "public_operation"
#
# RNG uses Philox counter-based generation. A zero seed is resolved once on
# the host and the effective 64-bit seed is recorded in the semantic graph.

# --- PhiloxNormal ------------------------------------------------------------
[[ops]]
name           = "philoxNormal"
category       = "Rng"
kind           = "unary"
kernel_forward = "PhiloxNormal"
slang_path     = "Core/Rng"
log_component  = "ML"
notes          = "Generate normal-distribution random values with Philox."
body           = "manual_session"
api_params     = [
    "const oa::Matrix& inA",
    "oa::F32 inMean = 0.0F",
    "oa::F32 inStddev = 1.0F",
    "oa::U64 inSeed = 0",
]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "none"
lowering            = "dispatch"
attributes          = [
	{ name = "mean", kind = "float", source = "inMean" },
	{ name = "stddev", kind = "float", source = "inStddev" },
	{ name = "seed", kind = "unsigned_integer", source = "inSeed" },
]

[ops.python]
args = ["a", "mean", "stddev", "seed"]
doc = "Generate a Philox normal sample with the input shape and dtype."

