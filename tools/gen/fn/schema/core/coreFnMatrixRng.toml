# --- Fill --------------------------------------------------------------------
[[ops]]
name           = "fill"
category       = "Rng"
kind           = "nullary_scalar"
kernel_forward = "Fill"
slang_path     = "Core/Shader/Compute/Flat"
log_component  = "ML"
notes          = "Create a Float32 matrix filled with a constant value."
forward_op     = "pc.Value"
scalar_param   = { name = "value", type = "oa::F32", push_field = "Value" }
api_params     = [
    "const oa::MatrixShape& inShape",
    "oa::F32 inValue",
]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = []
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "none"
lowering            = "dispatch"
attributes          = [
    { name = "shape", kind = "shape", source = "inShape" },
]

[ops.python]
args = ["shape", "value"]
doc = "Create a Float32 matrix of Shape filled with Value."

[ops.test]
cpu_reference = "3.14159f"
tolerance = "1e-6f"
test_sizes = [256, 1024]
scalar_value = "3.14159f"

# --- FillInPlace -------------------------------------------------------------
[[ops]]
name           = "fillInPlace"
category       = "Rng"
kind           = "unary_scalar"
kernel_forward = "Fill"
slang_path     = "Core/Shader/Compute/Flat"
log_component  = "ML"
notes          = "Replace every value in an existing matrix."
body           = "manual_session"
scalar_param   = { name = "value", type = "oa::F32", push_field = "Value" }
api_params     = [
    "oa::Matrix& inSelf",
    "oa::F32 inValue",
]
api_return     = "void"

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["write_outputs"]
mutated_inputs      = [0]
output_alias_inputs = [0]
control_flow        = "straight_line"
differentiation     = "none"
lowering            = "dispatch"
