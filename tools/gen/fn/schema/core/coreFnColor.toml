# Fn schema — Core host color utilities.
#
# These operations transform CPU oa::Color values. They deliberately have no
# semantic device contract, lowering, autograd policy, or Python exposure.
# Inline constexpr bodies and overload wrappers remain in the public header.
surface = "host_utility"
category = "Color"
namespace = "oa::FnColor"
file_prefix = "Color"
cpp_subdir = "FnColor"

[[ops]]
name = "lerp"
category = "Color"
kind = "binary"
body = "cpu_util"
generate_declaration = false
api_return = "oa::Color"
api_params = [
    "const oa::Color& inA",
    "const oa::Color& inB",
    "oa::F32 inT",
]
notes = "Linearly interpolate two CPU color values."

[[ops]]
name = "add"
category = "Color"
kind = "binary"
body = "cpu_util"
generate_declaration = false
api_return = "oa::Color"
api_params = ["const oa::Color& inA", "const oa::Color& inB"]
notes = "Add CPU color components."

