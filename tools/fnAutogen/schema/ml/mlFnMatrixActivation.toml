differentiation     = "reverse"
lowering            = "dispatch"

[ops.python]
args = ["a"]
doc = "Mish activation."

[ops.autograd]
grad_class = "oa::GradMish"
inputs     = ["inA"]
# MishBwd recomputes from the INPUT x (MishGrad(x)); saving the output is wrong.
saved      = ["inA"]
formula    = "auto_bwd_kernel"
[ops.test]
