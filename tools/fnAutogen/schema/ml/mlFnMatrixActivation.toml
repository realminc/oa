# --- LeakyRelu ---------------------------------------------------------------
[[ops]]
name           = "leakyRelu"
category       = "Activation"
kind           = "unary_scalar"
kernel_forward = "LeakyRelu"
kernel_backward = "LeakyReluBwd"
slang_path     = "Ml/Nn/Activation"
log_component  = "ML"
notes          = "Leaky ReLU activation: out = max(Alpha * A, A)."
forward_op     = "max(pc.Alpha * a, a)"
scalar_param   = { name = "alpha", type = "oa::F32", push_field = "Alpha" }
api_params     = ["const oa::Matrix& inA", "oa::F32 inAlpha"]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"

[ops.python]
args = ["a", "alpha"]
doc = "Leaky rectified linear unit activation."

[ops.autograd]
grad_class = "oa::GradLeakyRelu"
inputs     = ["inA"]
saved      = ["out"]
ctor_args  = ["inAlpha"]   # thread alpha into LeakyReluBwd (else negative-side grad collapses to default 0.01)
formula    = "auto_bwd_kernel"
[ops.test]
cpu_reference = "std::max(kScalar * a_host[i], a_host[i])"
tolerance = "1e-4f"
scalar_value = "0.01f"
test_sizes = [256]

# --- Elu ---------------------------------------------------------------------
[[ops]]
name           = "elu"
category       = "Activation"
kind           = "unary_scalar"
kernel_forward = "Elu"
kernel_backward = "EluBwd"
slang_path     = "Ml/Nn/Activation"
log_component  = "ML"
notes          = "ELU activation: out = A if A > 0 else Alpha * (exp(A) - 1)."
forward_op     = "a > 0.0f ? a : pc.Alpha * (exp(a) - 1.0f)"
scalar_param   = { name = "alpha", type = "oa::F32", push_field = "Alpha" }
api_params     = ["const oa::Matrix& inA", "oa::F32 inAlpha"]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"

[ops.python]
args = ["a", "alpha"]
doc = "Exponential linear unit activation."

[ops.autograd]
grad_class = "oa::GradElu"
inputs     = ["inA"]
saved      = ["out"]
ctor_args  = ["inAlpha"]   # thread alpha into EluBwd (else negative-side grad uses default 1.0)
formula    = "auto_bwd_kernel"
[ops.test]
cpu_reference = "a_host[i] > 0.0f ? a_host[i] : kScalar * (std::exp(a_host[i]) - 1.0f)"
tolerance = "1e-3f"
scalar_value = "1.0f"
test_sizes = [256]

