# --- SwiGLU ------------------------------------------------------------------
[[ops]]
name           = "swiglu"
category       = "Activation"
kind           = "binary"
kernel_forward = "Swiglu"
kernel_backward = "SwigluBwd"
slang_path     = "Ml/Nn/Swiglu"
log_component  = "ML"
notes          = "SwiGLU activation: out = SiLU(gate) * up."
forward_op     = "Swiglu(gate, up)"
api_params     = ["const oa::Matrix& inA", "const oa::Matrix& inB"]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix", "matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"

[ops.dnn]
role = "gated_multiply"

[ops.python]
args = ["a", "b"]
doc = "SwiGLU activation from separate gate and up matrices."

[ops.autograd]
grad_class = "oa::GradSwiglu"
inputs     = ["inA", "inB"]
saved      = ["inA", "inB", "out"]
formula    = "manual"
[ops.test]
# Note: Binary activation - test needs custom implementation
skip_test = true

# --- SiluMul -----------------------------------------------------------------
[[ops]]
name           = "siluMul"
category       = "Activation"
kind           = "unary_scalar"
kernel_forward = "SiluMul"
kernel_backward = "SiluMulBwd"
slang_path     = "Ml/Nn/Swiglu"
log_component  = "ML"
notes          = "SiLU on first half, multiply with second half: out = SiLU(A[:N]) * A[N:]."
forward_op     = "SiluMul(a)"
scalar_param   = { name = "intermediateSize", type = "oa::U32", push_field = "intermediate_size" }
output         = { shape = "last_dim_half" }
dispatch_workgroups = "output_elemwise"
api_params     = ["const oa::Matrix& inA", "oa::U32 inIntermediateSize"]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"

[ops.python]
args = ["a", "intermediateSize"]
doc = "Apply SiLU to the first half of the final dimension and multiply it by the second half."

[ops.autograd]
# SiluMulBwd needs the INPUT (gate||up); the forward output SiLU(gate)*up is
# not invertible. Saving "out" silently fed the wrong tensor to the backward.
grad_class = "oa::GradSiluMul"
inputs     = ["inA"]
saved      = ["inA"]
formula    = "manual"
[ops.test]
# Note: This op splits input in half - test needs special handling
# For now, skip test generation (requires custom test code)
skip_test = true

# --- Geglu -------------------------------------------------------------------
[[ops]]
name           = "geglu"
category       = "Activation"
kind           = "unary_scalar"
kernel_forward = "Geglu"
kernel_backward = "GegluBwd"
slang_path     = "Ml/Nn/Geglu"
log_component  = "ML"
notes          = "GEGLU activation: out = A[:N] * GELU(A[N:])."
forward_op     = "Geglu(a)"
scalar_param   = { name = "intermediateSize", type = "oa::U32", push_field = "intermediate_size" }
output         = { shape = "last_dim_half" }
dispatch_workgroups = "output_elemwise"
api_params     = ["const oa::Matrix& inA", "oa::U32 inIntermediateSize"]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"

[ops.python]
args = ["a", "intermediateSize"]
doc = "Apply GEGLU to two halves of the final matrix dimension."

[ops.autograd]
# GegluBwd needs the INPUT (up||gate); the forward output up*GELU(gate) is not
# invertible. Saving "out" silently fed the wrong tensor to the backward.
grad_class = "oa::GradGeglu"
inputs     = ["inA"]
saved      = ["inA"]
formula    = "manual"
[ops.test]
# Note: This op splits input in half - test needs special handling
# For now, skip test generation (requires custom test code)
skip_test = true

# --- Softplus ---------------------------------------------------------------
# Numerically stable form: log(1+e^a) overflows f32 for a>~88 (e^a → inf).
# The identity max(a,0)+log1p(e^-|a|) is mathematically exact and overflow-free
# (the exp argument is always ≤ 0). Backward d/da softplus(a) = sigmoid(a); with
# the saved output y=softplus(a)≥0 this equals 1-e^-y (stable). See SoftplusBwd.
[[ops]]
name           = "softplus"
category       = "Activation"
kind           = "unary"
kernel_forward = "Softplus"
kernel_backward = "SoftplusBwd"
slang_path     = "Ml/Nn/Activation"
log_component  = "ML"
notes          = "Softplus: out = log(1+exp(A)), computed stably as max(A,0)+log1p(exp(-|A|)) (no f32 overflow)."
forward_op     = "max(a, 0.0f) + log(1.0f + exp(-abs(a)))"
api_params     = ["const oa::Matrix& inA"]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "match_input"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"

[ops.python]
args = ["a"]
doc = "Numerically stable softplus activation."

[ops.autograd]
grad_class = "oa::GradSoftplus"
inputs     = ["inA"]
saved      = ["out"]
formula    = "auto_bwd_kernel"
[ops.test]
cpu_reference = "std::max(a_host[i], 0.0f) + std::log(1.0f + std::exp(-std::abs(a_host[i])))"
tolerance = "1e-3f"
test_sizes = [256]
