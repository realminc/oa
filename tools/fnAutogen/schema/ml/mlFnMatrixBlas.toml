# Fn schema — Ml/FnMatrix BLAS ops (Linear layer operations).
surface = "public_operation"
autograd_node_header = "oa/ml/autograd/matrix/autogradBlas.h"
#
# This is the *source of truth* for ML-specific BLAS operations.
# The generator emits .h declarations, .cpp implementations from this file.
# See tools/fnAutogen/rEADME.md and tools/fnAutogen/oafnautogen.py.
#
# Note: MatMul is in Core (general-purpose BLAS operation)
# Linear/LinearRelu are ML-specific neural network layers

# --- Linear ------------------------------------------------------------------
[[ops]]
name                 = "linear"
category             = "Blas"
kind                 = "binary"
kernel_backward_data = "LinearDataBwd"
kernel_backward_weight = "LinearWeightBwd"
slang_path           = "Core/Blas/Gemm"
log_component        = "ML"
notes                = "Linear layer: out = Input @ Weight^T + optional Bias. The semantic input tuple always reserves the Bias slot; an omitted bias is recorded as an absent optional value."
body                 = "manual_session"
generate_declaration = false
api_return           = "oa::Matrix"
api_params           = [
    "const oa::Matrix& inX",
    "const oa::Matrix& inWeight",
    "const oa::Matrix& inBias = oa::Matrix{}",
]

[ops.contract]
input_kinds         = ["matrix", "matrix", "matrix"]
optional_inputs     = [2]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "gemm"

[ops.dnn]
role = "matmul"
epilogue = "bias"
epilogue_requires_input = 2

[ops.python]
args = ["x", "weight", "bias"]
doc = "Apply a linear projection using the OA weight-layout convention and an optional bias."

[ops.autograd]
grad_class = "oa::GradLinear"
inputs     = ["inX", "inWeight", "inBias"]
saved      = ["inX", "inWeight"]
attach     = "standard"
output_shape = true

# --- Fused Linear + activation epilogues ------------------------------------
