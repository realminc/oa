# Fn schema — vector-quantization assignment and EMA codebook update.
category = "Vq"
namespace = "oa::FnMatrix"
file_prefix = "FnMatrix"
cpp_subdir = "Vq"
surface = "public_operation"

[[ops]]
name = "vqAssign"
kind = "binary"
kernel_forward = "VqAssign"
body = "manual_session"
generate_declaration = false
api_return = "oa::VqAssignResult"
api_params = [
    "const oa::Matrix& inZe",
    "const oa::Matrix& inCodebook",
]
notes = "Assign every latent row to its nearest codebook row and return both Int32 indices and gathered values."

[ops.kernel]
id_prefix = "Ml"
id_local = 349
category = "Ml"
origin = "oa"
source = "ops/vqAssign"

[ops.python_result]
cpp_type = "oa::VqAssignResult"
members = ["idx", "zq"]

[ops.contract]
input_kinds = ["matrix", "matrix"]
output_kinds = ["matrix", "matrix"]
shape_rule = "explicit"
dtype_rule = "explicit"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
