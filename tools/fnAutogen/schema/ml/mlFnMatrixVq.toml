api_params = [
    "const oa::Matrix& inZe",
    "const oa::Matrix& inIdx",
    "oa::Matrix& inOutEmbedSum",
    "oa::Matrix& inOutClusterSize",
    "oa::Matrix& outCodebook",
    "oa::F32 inDecay",
    "oa::F32 inEps",
    "oa::F32 inDeadThreshold",
    "oa::U32 inSeed",
    "bool inNormalize",
]
notes = "Update EMA vector-quantization statistics and codebook storage in place, including deterministic seed-controlled dead-code revival."

[ops.kernel]
id_prefix = "Ml"
id_local = 350
category = "Ml"
origin = "oa"
source = "ops/vqEmaUpdate"

[ops.contract]
input_kinds = ["matrix", "matrix", "matrix", "matrix", "matrix"]
