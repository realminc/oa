kind = "session_command"
body = "manual_session"
generate_declaration = false
api_return = "void"
api_params = [
    "oa::Matrix& inOutParam",
    "oa::Matrix& inOutM",
    "oa::Matrix& inOutV",
    "const oa::Matrix& inGrad",
    "oa::F32 inLr",
    "oa::F32 inBeta1",
    "oa::F32 inBeta2",
    "oa::F32 inEps",
    "oa::F32 inWeightDecay",
    "oa::I32 inStep",
]
notes = "Record one eager oa::AdamW parameter-state update."

[ops.session]
owners = ["oa::AdamW"]
transition = "Recording -> Recorded"
effects = ["read_state", "write_state", "device_work"]
completion = "recorded"

