# Fn schema — low-level optimizer recording commands.
#
# These functions mutate caller-owned parameter and optimizer state and return
# no semantic value. They are therefore session commands, not stateless value
# operations, even though the mutation is fully explicit in their parameters.
category = "Optim"
namespace = "oa::FnOptim"
file_prefix = "FnOptim"
cpp_subdir = "FnOptim"
surface = "session_command"

[[ops]]
name = "adamWAdvanceGraphState"
kind = "session_command"
body = "manual_session"
generate_declaration = false
api_return = "void"
api_params = ["oa::Matrix& inOutState"]
notes = "Record an increment of replay-safe oa::AdamW state."

[ops.session]
owners = ["oa::AdamW", "oa::TrainingProgram"]
transition = "Recording -> Recorded"
effects = ["read_state", "write_state", "device_work"]
completion = "recorded"

