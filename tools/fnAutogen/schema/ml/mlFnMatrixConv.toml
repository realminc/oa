# Fn schema — Ml/FnMatrix convolution and layout operations.
surface = "kernel"
autograd_node_header = "oa/ml/autograd/matrix/autogradConv.h"
#
# Public rows freeze semantic contracts for the existing hand-written
# convolution lowerings. The legacy Conv1d/Im2Col/Col2Im rows at the end remain
# internal kernel metadata and are not public operation identities.

# --- Conv1d ------------------------------------------------------------------
[[ops]]
name           = "conv1d"
category       = "Conv"
kind           = "binary"
slang_path     = "Ml/Nn/Conv"
log_component  = "ML"
notes          = "1D convolution: out = Conv(Input, Weight)."
body           = "manual_session"
extra_params   = [
    { name = "stride", type = "oa::I32", default = "1" },
    { name = "padding", type = "oa::I32", default = "0" },
    { name = "dilation", type = "oa::I32", default = "1" },
    { name = "groups", type = "oa::I32", default = "1" }
]

# --- Conv2d ------------------------------------------------------------------
[[ops]]
name           = "conv2d"
category       = "Conv"
kind           = "binary"
surface        = "public_operation"
kernel_forward = "Conv2d"
slang_path     = "Ml/Nn/Conv"
log_component  = "ML"
notes          = "2D convolution: out = Conv(Input, Weight)."
body           = "manual_session"
generate_declaration = false
api_params   = [
    "const oa::Matrix& inX",
    "const oa::Matrix& inWeight",
    "const oa::Matrix& inBias",
    "oa::U32 inStride",
    "oa::U32 inPadding",
    "oa::U32 inGroups = 1",
]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix", "matrix", "matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "reverse"
lowering            = "dispatch"
attributes = [
    { name = "stride", kind = "unsigned_integer", source = "inStride" },
    { name = "padding", kind = "unsigned_integer", source = "inPadding" },
    { name = "groups", kind = "unsigned_integer", source = "inGroups" },
]

[ops.autograd]
grad_class   = "oa::GradConv2d"
inputs       = ["inX", "inWeight", "inBias"]
saved        = ["inX", "inWeight"]
formula      = "manual"
attach       = "standard"
output_shape = true
state = [
    { member = "stride_", source = "inStride", type = "oa::U32" },
    { member = "padding_", source = "inPadding", type = "oa::U32" },
    { member = "groups_", source = "inGroups", type = "oa::U32" },
]

[ops.python]
args = ["x", "weight", "bias", "stride", "padding", "groups"]
doc = "Apply grouped 2D convolution to an NCHW input."

