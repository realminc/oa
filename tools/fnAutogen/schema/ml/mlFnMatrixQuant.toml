# --- Semantic public surface -------------------------------------------------

[[ops]]
name = "quantize"
category = "Quantize"
kind = "unary"
surface = "stable_composite"
body = "manual_session"
generate_declaration = false
api_return = "oa::QuantMatrix"
api_params = [
    "const oa::Matrix& inInput",
    "oa::Quantization inQuantization",
]
notes = "Quantize Float32 storage into one native OA Q4 or Q8 semantic weight value."

[ops.contract]
input_kinds = ["matrix"]
output_kinds = ["quant_matrix"]
shape_rule = "match_input"
dtype_rule = "explicit"
effects = ["read_inputs", "write_outputs"]
mutated_inputs = []
output_alias_inputs = [-1]
control_flow = "conditional"
differentiation = "none"
lowering = "dispatch"
attributes = [
    { name = "quantization", kind = "enum", source = "inQuantization" },
]

[ops.python]
binding = "manual"
args = ["input", "quantization"]
doc = "Quantize a Float32 matrix into one native OA Q4 or Q8 weight value."

