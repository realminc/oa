# Fn schema — semantic Q4/Q8 quantization plus private plane lowerings.
surface = "internal_operation"
#
# This schema owns the admitted public operation contracts and fixed-kernel
# identities. The current manual lowering and Slang bodies remain intentional;
# mechanically derivable declarations, registry rows and compilation lists are
# generated from these rows.
#
# Q4 and Q8 use explicit payload and Float32-scale planes. Their MatMulNt
# operations consume those planes directly and never materialize a Float32
# weight matrix. GGML/GGUF interleaved-block import and Q4_K remain separate
# format-conversion work; the two representations must not be conflated.

# --- QuantizeQ4 ------------------------------------------------------------
[[ops]]
name           = "quantizeQ4"
surface        = "internal_operation"
category       = "Quantize"
kind           = "unary"
kernel_forward = "QuantizeQ4"
slang_path     = "Ml/Quantize"
log_component  = "ML"
notes          = "Quantize Float32 into OA's native symmetric Q4 block plane using round-to-nearest-even."
body           = "manual_session"
generate_declaration = false
api_params     = [
    "const oa::Matrix& inInput",
    "const oa::Matrix& inScale",
]
api_return     = "oa::Matrix"

[ops.kernel]
id_prefix = "Ml"
id_local = 138
category = "Ml"
origin = "oa"
source = "quantize/quantizeQ4"

[ops.contract]
input_kinds         = ["matrix", "matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "explicit"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "none"
lowering            = "dispatch"

