# Fn schema — Core/FnMatrix elemwise ops (17).
surface = "public_operation"
generate_python_bindings = true
autograd_node_header = "oa/core/autograd/matrix/autogradElemwise.h"
#
# This is the *source of truth* for these 17 ops. The generator emits:
#   - .h declarations, .cpp implementations, .slang shaders (forward ops)
#   - Autograd/matrix/AutogradElemwise.gen.h (gradient node classes)
# See tools/fnAutogen/rEADME.md and tools/fnAutogen/oafnautogen.py.
#
# Fields per [[ops]] entry:
#   name              op name (PascalCase, no Oa prefix — namespace adds it)
#   category          Elemwise | Blas | Reduce | Shape | Index | Activation | ...
#   kind              binary | unary | unary_scalar
#   kernel_forward    Slang shader ID — must exist in kernelRegistry.h
#   dispatch_id_macro optional: oa::ComputeKernelId::<Name> instead of "Name"
#                     literal in oa::VkDispatch::Run (matches existing Scale)
#   log_component     oa::LogComponent::* enum value
#   notes             short docstring
#   forward_op        Slang body — "a + b", "a - b", "abs(a)", "log(a)",
#                     "a * pc.Alpha", "pow(a, pc.Exponent)" — used by
#                     shader template; receives loaded scalars `a`, `b`
#                     and emits oaStore(...)
#   immediate.alias_of  optional: immediate-mode body delegates to another op
#                       (e.g. Neg → Scale(-1)) — preserves existing behavior
#   autograd.*        gradient wiring (see below)
#
# Autograd block:
#   grad_class    name of the oa::GradXxx class (defined in Autograd.h or generated)
#   inputs        list of parameter names; populates SetGraphInputs in slot order
#   saved         list of saved tensor names (populates Saved_ vector)
#   ctor_args     list of expressions passed to oa::makeShared<grad_class>(...)
#   formula       "auto_elemwise" | "auto_unary" | "manual:<Op>" | "none"

# --- Add ---------------------------------------------------------------------
[[ops]]
name           = "add"
category       = "Elemwise"
kind           = "binary"
kernel_forward = "Add"
log_component  = "ML"
notes          = "Element-wise addition: out = A + B."
forward_op     = "a + b"
body           = "manual_session"
api_params     = ["const oa::Matrix& inA", "const oa::Matrix& inB"]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds     = ["matrix", "matrix"]
output_kinds    = ["matrix"]
shape_rule      = "broadcast"
dtype_rule      = "match_input"
effects         = ["read_inputs", "write_outputs"]
mutated_inputs  = []
output_alias_inputs = [-1]
control_flow    = "straight_line"
differentiation = "reverse"
lowering        = "dispatch"

[ops.dnn]
role = "add"

[ops.python]
args = ["a", "b"]
doc = "Element-wise matrix addition with broadcasting."

[ops.autograd]
grad_class = "oa::GradAdd"
inputs     = ["inA", "inB"]
saved      = []
formula    = "auto_binary_add"
attach     = "broadcast_binary"
broadcast_op = "Add"

[ops.test]
cpu_reference = "a_host[i] + b_host[i]"
tolerance = "1e-4f"
test_sizes = [256, 1024]
edge_cases = ["zeros", "negatives"]
numerical_grad = false
benchmark = false

# --- AddInPlace --------------------------------------------------------------
# Contract-only entry for the handwritten compatibility API. The semantic
# graph records an SSA output version that aliases and mutates inSelf; lowering
# may execute it directly or fuse several independent updates into MultiAdd.
[[ops]]
name                 = "addInPlace"
category             = "Elemwise"
kind                 = "binary"
kernel_forward       = "Add"
log_component        = "ML"
notes                = "In-place matrix addition with an explicit mutated/aliased output contract."
body                 = "manual_session"
generate_declaration = false
api_params           = ["oa::Matrix& inSelf", "const oa::Matrix& inOther"]
api_return           = "void"

[ops.contract]
input_kinds         = ["matrix", "matrix"]
output_kinds        = ["matrix"]
shape_rule          = "broadcast"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = [0]
output_alias_inputs = [0]
control_flow        = "straight_line"
differentiation     = "none"
lowering            = "dispatch"

