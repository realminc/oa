# CoreFnMatrixBlas.toml
surface = "public_operation"
autograd_node_header = "oa/core/autograd/matrix/autogradBlas.h"
# MatMul is a general-purpose BLAS operation (stays in Core)
# Linear/LinearRelu are ML-specific (moved to Ml)

category = "Blas"
file_category = "Blas"
mode = "additive"

[[ops]]
name = "matMulNt"
category = "Blas"
kind = "binary"
slang_path = "Core/Blas/Gemm"
log_component = "ML"
notes = "oa::Matrix multiplication: B is [N,K] and out = A @ Bᵀ (the OA weight convention, shared with Linear/attention; NOT PyTorch-standard A@B with B as [K,N]). For batched/standard A@B use Bmm. Router resolves precision at context execution."
body = "manual_session"
api_params = ["const oa::Matrix& inA", "const oa::Matrix& inB", "oa::MatMulPrecision inPrecision = oa::MatMulPrecision::Auto"]
api_return = "oa::Matrix"

[ops.contract]
input_kinds     = ["matrix", "matrix"]
output_kinds    = ["matrix"]
shape_rule      = "matmul_nt"
dtype_rule      = "match_input"
effects         = ["read_inputs", "write_outputs"]
mutated_inputs  = []
output_alias_inputs = [-1]
control_flow    = "straight_line"
differentiation = "reverse"
lowering        = "gemm"

[ops.dnn]
role = "matmul"

[ops.python]
args = ["a", "b", "precision"]
doc = "oa::Matrix multiplication C = A @ B^T using the OA weight-layout convention."

[ops.autograd]
grad_class = "oa::GradMatMulNt"
inputs = ["inA", "inB"]
saved = ["inA", "inB"]
formula = "manual:MatMulNt"
attach = "standard"
input_ranks = [2, 2]
output_shape = true
