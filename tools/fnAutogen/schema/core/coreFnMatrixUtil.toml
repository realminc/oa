# Fn schema — Core/FnMatrix internal helper operations (2).
surface = "kernel"
#
# This is the *source of truth* for utility and helper operations. The generator
# emits .h declarations, .cpp implementations, and .slang shaders from this file.
# See tools/fnAutogen/rEADME.md and tools/fnAutogen/oafnautogen.py.
#
# Utility operations for data movement, type conversion, and misc helpers.

# --- SumDim ------------------------------------------------------------------
[[ops]]
name           = "sumDim"
category       = "Util"
kind           = "unary"
kernel_forward = "SumDim"
slang_path     = "Core/Shader/Compute/Flat"
log_component  = "ML"
notes          = "Sum along specific dimension."
body           = "manual_session"
extra_params   = [
    { name = "dim", type = "oa::I32", default = "0" }
]

# --- GatherBwd ---------------------------------------------------------------
[[ops]]
name           = "gatherBwd"
category       = "Util"
kind           = "binary"
surface        = "internal_operation"
kernel_forward = "GatherBwd"
slang_path     = "Ml/Nn/Embed"
log_component  = "ML"
notes          = "Gather backward pass for embeddings."
body           = "manual_session"
generate_declaration = false
api_params     = [
    "const oa::Matrix& inIndices",
    "const oa::Matrix& inGradOutput",
    "oa::I32 inVocabSize",
    "oa::I32 inEmbedDim",
]
api_return     = "oa::Matrix"

[ops.contract]
input_kinds         = ["matrix", "matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "none"
lowering            = "dispatch"
attributes = [
    { name = "vocabSize", kind = "signed_integer", source = "inVocabSize" },
    { name = "embedDim", kind = "signed_integer", source = "inEmbedDim" },
]
