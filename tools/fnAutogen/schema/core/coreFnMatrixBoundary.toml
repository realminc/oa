# Fn schema — Core matrix value factories and host boundaries.
#
# These rows deliberately do not own semantic operation contracts:
# - factories allocate/upload values outside the executable operation graph;
# - aliases delegate to schema-owned Fill/Philox operations;
# - observations cross the device/host boundary and force completion.
category = "Boundary"
namespace = "oa::FnMatrix"
file_prefix = "FnMatrix"
cpp_subdir = "FnMatrix"

[[ops]]
name = "weightDtype"
kind = "unary"
surface = "host_utility"
body = "cpu_util"
generate_declaration = false
api_return = "oa::ScalarType"
api_params = []
notes = "Read the active engine precision dtype, or FP32 without an active context."

[[ops]]
name = "setRngSeed"
kind = "unary"
surface = "host_utility"
body = "cpu_util"
generate_declaration = false
api_return = "void"
api_params = ["oa::U64 inSeed"]
notes = "Seed the thread-local host generator which supplies default Philox seeds."

[[ops]]
name = "empty"
kind = "unary"
surface = "host_utility"
body = "cpu_util"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "oa::MatrixShape inShape",
    "oa::ScalarType inDtype = weightDtype()",
    "oa::MemoryPlacement inPlacement = oa::MemoryPlacement::Auto",
]
notes = "Allocate an uninitialized matrix value through execution-memory policy."

[[ops]]
name = "fromBytes"
kind = "unary"
surface = "host_utility"
body = "cpu_util"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "oa::Span<const oa::U8> inData",
    "oa::MatrixShape inShape",
    "oa::ScalarType inDtype = weightDtype()",
]
notes = "Create a matrix value by validating, converting, and uploading host bytes."

[[ops]]
name = "fromInt32"
kind = "unary"
surface = "host_utility"
body = "cpu_util"
generate_declaration = false
api_return = "oa::Matrix"
api_params = [
    "oa::Span<const oa::I32> inData",
    "oa::MatrixShape inShape",
    "oa::ScalarType inDtype = oa::ScalarType::Int32",
]
notes = "Create a matrix value by validating, converting, and uploading host integers."

[[ops]]
name = "copyToHost"
kind = "unary"
surface = "host_observation"
body = "manual_session"
generate_declaration = false
api_return = "oa::Status"
api_params = [
    "const oa::Matrix& inSrc",
    "void* outHost",
    "oa::U64 inBytes",
]
notes = "Complete pending work and copy a matrix value into caller-owned host memory."

