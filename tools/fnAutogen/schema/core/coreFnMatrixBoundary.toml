name = "scalar"
kind = "unary"
surface = "host_observation"
body = "manual_session"
generate_declaration = false
api_return = "oa::F32"
api_params = ["const oa::Matrix& inSrc"]
notes = "Complete pending work and observe the first matrix element as a host scalar."

