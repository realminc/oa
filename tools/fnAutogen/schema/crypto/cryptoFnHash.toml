# --- MerkleRoot --------------------------------------------------------------
[[ops]]
name           = "merkleRoot"
category       = "Crypto"
kind           = "unary"
kernel_forward = "Merkle/MerkleReduce"
slang_path     = "Crypto/Hash"
log_component  = "CRYPTO"
notes          = "Compute Merkle tree root from leaf hashes (power-of-two)."
body           = "manual_session"
generate_declaration = false
api_return     = "oa::Matrix"
api_params     = ["const oa::Matrix& inA"]

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "loop"
differentiation     = "none"
lowering            = "dispatch"

[ops.python]
args = ["a"]
doc = "Compute a SHAKE-256 Merkle root from a power-of-two UInt8 [N, 32] leaf matrix."

# KMAC-256 stays a CPU primitive (Kmac256, Crypto/Keccak.h) — no GPU kernel.
# Merkle inclusion-proof verification stays a CPU primitive
# (VerifyMerkleProof, Crypto/Hash.h): the flat matrix form carries no
# left/right path bits. No GPU proof-verification operation is currently admitted.
