# Fn schema — Crypto/FnHash operations.
surface = "public_operation"
#
# This is the *source of truth* for hash operations. The generator
# emits .h declarations, .cpp implementations from this file.
# See tools/fnAutogen/rEADME.md and tools/fnAutogen/oafnautogen.py.
#
# Hash operations: SHAKE, Keccak, KMAC, Merkle trees.

# Schema-level metadata
file_category = "Hash"
file_prefix = "FnHash"

# --- Shake256 ----------------------------------------------------------------
[[ops]]
name           = "shake256"
category       = "Crypto"
kind           = "unary"
kernel_forward = "Shake/Shake256"
slang_path     = "Crypto/Hash"
log_component  = "CRYPTO"
notes          = "SHAKE-256 extendable-output function (32-byte default)."
body           = "manual_session"
generate_declaration = false
api_return     = "oa::Matrix"
api_params     = [
    "const oa::Matrix& inA",
    "oa::U32 inOutputLength = 32",
]

[ops.contract]
input_kinds         = ["matrix"]
output_kinds        = ["matrix"]
shape_rule          = "explicit"
dtype_rule          = "match_input"
effects             = ["read_inputs", "write_outputs"]
mutated_inputs      = []
output_alias_inputs = [-1]
control_flow        = "straight_line"
differentiation     = "none"
lowering            = "dispatch"
attributes = [
    { name = "outputLength", kind = "unsigned_integer", source = "inOutputLength" },
]

[ops.python]
args = ["a", "outputLength"]
doc = "Batch SHAKE-256 over rows of a UInt8 [N, MessageLength] matrix."

